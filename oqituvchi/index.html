<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <script>try{if(localStorage.getItem('fizika-theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../img/icons/icon-192.png" type="image/png">
    <title>O'qituvchi paneli — Fizika 10–11</title>
    <link rel="stylesheet" href="../styles.css?v=20261101g">
    <link rel="stylesheet" href="../app.css?v=20261101g">
    <style>
        .cls-card { cursor: pointer; }
        .cls-card:hover { border-color: var(--a-blue); }
        .code { font-family: var(--font-mono); font-size: 1.4rem; font-weight: 800; letter-spacing: 0.06em; color: var(--a-blue); }
        .crumbs { margin-bottom: var(--sp-3); }
        .crumbs a { color: var(--a-blue); font-weight: 600; text-decoration: none; }
        .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 0.9rem; }
        .kv b { color: var(--a-muted); font-weight: 600; }
        .snap td, .snap th { font-size: 0.82rem; padding: 6px 8px; white-space: nowrap; }
        .stat-pill { display: inline-block; margin-right: 8px; font-size: 0.82rem; color: var(--a-muted); }
        .stat-pill b { color: var(--a-ink); }
        fieldset { border: 1px solid var(--a-line); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-3); }
        legend { font-weight: 700; font-size: 0.9rem; padding: 0 6px; }
    </style>
</head>
<body class="app">
    <header class="app-nav">
        <div class="wrap">
            <a class="app-brand" href="../index.html"><img src="../img/icons/icon-192.png" alt="" width="32" height="32">Fizika 10–11</a>
            <button type="button" class="btn-a ghost small menu-btn" aria-label="Menyu">☰</button>
            <nav id="appNav" aria-label="Menyu"></nav>
        </div>
    </header>

    <main>
        <div class="wrap">
            <div class="app-head"><h1 id="hello">👩‍🏫 O'qituvchi paneli</h1><p class="muted" id="school"></p></div>
            <div class="tabs-a" role="tablist">
                <button type="button" role="tab" data-route="sinflar">🏫 Sinflar</button>
                <button type="button" role="tab" data-route="topshiriqlar">📋 Topshiriqlar</button>
                <button type="button" role="tab" data-route="statistika">📊 Statistika</button>
                <button type="button" role="tab" data-route="savollar">❓ Savollarim</button>
                <button type="button" role="tab" data-route="ishlanmalar">📚 Ishlanmalarim</button>
            </div>
            <div class="msg" id="msg" role="status" aria-live="polite"></div>
            <div id="view"></div>
        </div>
    </main>
    <div class="print-area" id="printArea"></div>

    <script src="../theme.js?v=20261101g"></script>
    <script src="../api.js?v=20261101g"></script>
    <script src="../app.js?v=20261101g"></script>
    <script src="index.js?v=20261101g"></script>
</body>
</html>
