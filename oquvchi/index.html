<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <script src="../theme-init.js?v=20261101i"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../img/icons/icon-192.png" type="image/png">
    <title>Mening topshiriqlarim — Fizika 10–11</title>
    <link rel="stylesheet" href="../styles.css?v=20261101i">
    <link rel="stylesheet" href="../app.css?v=20261101i">
</head>
<body class="app">
    <header class="app-nav">
        <div class="wrap">
            <a class="app-brand" href="../index.html"><img src="../img/icons/icon-192.png" alt="" width="32" height="32">Fizika 10–11</a>
            <button type="button" class="btn-a ghost small menu-btn" aria-label="Menyu">☰</button>
            <nav id="appNav" aria-label="Menyu"></nav>
        </div>
    </header>

    <main>
        <div class="wrap">
            <div class="app-head">
                <h1 id="hello">📋 Mening topshiriqlarim</h1>
                <p id="classes" class="muted"></p>
            </div>
            <div class="msg" id="msg" role="status" aria-live="polite"></div>

            <div class="tabs-a" role="tablist">
                <button type="button" role="tab" data-tab="tasks" aria-selected="true">Topshiriqlar</button>
                <button type="button" role="tab" data-tab="labs" aria-selected="false">Jurnallarim</button>
                <button type="button" role="tab" data-tab="tests" aria-selected="false">Test natijalarim</button>
            </div>

            <section data-pane="tasks">
                <div class="row" style="margin-bottom:var(--sp-3)">
                    <div class="field" style="max-width:220px">
                        <label for="filter">Ko'rsatish</label>
                        <select id="filter">
                            <option value="active">Bajarilishi kerak</option>
                            <option value="done">Bajarilgan</option>
                            <option value="all">Hammasi</option>
                        </select>
                    </div>
                </div>
                <div class="cards-a" id="tasks"></div>
            </section>

            <section data-pane="labs" hidden>
                <div class="tbl-wrap"><table class="tbl">
                    <thead><tr><th>Sana</th><th>Model</th><th>O'lchovlar</th><th>Natija</th><th></th></tr></thead>
                    <tbody id="labs"></tbody>
                </table></div>
            </section>

            <section data-pane="tests" hidden>
                <div id="myStats"></div>
                <div class="tbl-wrap"><table class="tbl">
                    <thead><tr><th>Sana</th><th>Natija</th><th>Baho</th><th></th></tr></thead>
                    <tbody id="tests"></tbody>
                </table></div>
            </section>

            <form class="panel" id="fJoin" style="margin-top:var(--sp-5)" novalidate>
                <h2>➕ Yangi sinfga qo'shilish</h2>
                <div class="row">
                    <div class="field"><label for="jCode">Sinf kodi</label><input id="jCode" placeholder="FZ-7K3Q" style="text-transform:uppercase"></div>
                    <button class="btn-a" type="submit" style="margin-bottom:var(--sp-3)">Qo'shilish</button>
                </div>
            </form>
        </div>
    </main>

    <script src="../theme.js?v=20261101i"></script>
    <script src="../api.js?v=20261101i"></script>
    <script src="../app.js?v=20261101i"></script>
    <script src="index.js?v=20261101i"></script>
</body>
</html>
