# Backend CI (TZ 12.5): har bir PR va push'da lint + testlar PostgreSQL bilan
name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml", "*.html", "*.js", "modellar/**", "testlar/**", "oquvchi/**", "oqituvchi/**", "dars_ishlanmalar/**"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml", "*.html", "*.js", "modellar/**", "testlar/**", "oquvchi/**", "oqituvchi/**", "dars_ishlanmalar/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fizika
          POSTGRES_USER: fizika
          POSTGRES_PASSWORD: fizika
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fizika" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://fizika:fizika@localhost:5432/fizika
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Migratsiyalar to'liqmi
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Testlar (qamrov ≥ 75%)
        run: pytest --cov --cov-fail-under=75
      - name: Xavfsizlik tahlili (bandit)
        run: bandit -q -r apps config -x '*/migrations/*,*/tests/*' -ll
      - name: Production sozlamalari (check --deploy)
        run: python manage.py check --deploy --fail-level ERROR --settings=config.settings.production
        env:
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-key-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: site.uz
      - name: Zaifliklar (pip-audit) — ma'lum zaiflikli kutubxona bo'lsa CI to'xtaydi
        run: pip install pip-audit && pip-audit -r requirements.txt -r requirements-dev.txt
