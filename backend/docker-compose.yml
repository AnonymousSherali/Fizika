# Ishga tushirish:  cp .env.example .env  (qiymatlarni to'ldiring)
#                   docker compose up -d --build
#                   docker compose exec api python manage.py migrate
#                   docker compose exec api python manage.py import_simulations
#                   docker compose exec api python manage.py createsuperuser
services:
  api:
    build: .
    env_file: .env
    environment:
      FRONTEND_DIR: /frontend
    volumes:
      - ../:/frontend:ro          # mavjud statik sayt (repozitoriy ildizi)
      - media:/app/media
    depends_on: [db, redis]
    restart: unless-stopped

  worker:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    depends_on: [db, redis]
    restart: unless-stopped

  beat:
    build: .
    command: celery -A config beat -l info
    env_file: .env
    depends_on: [redis]
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fizika}
      POSTGRES_USER: ${POSTGRES_USER:-fizika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fizika}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  nginx:
    image: nginx:1.27
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../:/srv/site:ro          # statik sayt: index.html, modellar/, testlar/ ...
      - media:/srv/media:ro
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata: {}
  media: {}
