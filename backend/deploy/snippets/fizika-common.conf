# Umumiy qoidalar (80 va 443 server bloklari uchun bitta).
# MUHIM: backend yo'llari «^~» bilan — aks holda pastdagi regex qoidalar (\.css, \.pdf ...) ularni
# statik papkadan qidirib 404 qaytarardi (admin CSS, /api/v1/i18n/ru.js, yuklangan fayllar).

proxy_set_header Host $http_host;   # port bilan: Django CSRF/Origin tekshiruvi nostandart portda ham to'g'ri ishlasin
proxy_set_header X-Real-IP $remote_addr;
# Mijoz yuborgan X-Forwarded-For e'tiborga olinmaydi — faqat haqiqiy manzil (backend: NUM_PROXIES=1)
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Xavfsizlik sarlavhalari (statik sahifalar uchun ham)
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy $fizika_csp always;   # bo'sh qiymat (admin/api) — sarlavha yuborilmaydi

location ^~ /api/    { proxy_pass http://django; }
location ^~ /admin/  { proxy_pass http://django; }
location ^~ /static/ { proxy_pass http://django; }

# Maxfiy fayllar (o'quvchi ishlari, moderatsiyadagi ishlanmalar): tashqaridan ochilmaydi,
# faqat Django ruxsatni tekshirib X-Accel-Redirect qaytarganda beriladi (apps/core/files.py)
location ^~ /media/private/ { internal; alias /srv/media/private/; }
location ^~ /media/ { alias /srv/media/; expires 7d; }

# Statik sayt (o'zgarmagan holda)
root /srv/site;
index index.html;
location / { try_files $uri $uri/ =404; }
# «expires -1» = Cache-Control: no-cache. add_header ishlatilmaydi: location ichidagi add_header yuqoridagi
# xavfsizlik sarlavhalarini (va HTTPS'dagi HSTS ni) bekor qilib qo'yardi
location = /sw.js { expires -1; }
location ~* \.(html)$ { expires -1; }
location ~* \.(css|js)$ { expires 1d; }
location ~* \.(png|jpg|svg|woff2|pdf|docx)$ { expires 7d; }
location ~ /\.(git|env|github) { deny all; }
location ^~ /backend/ { deny all; }   # backend manba kodi saytda ko'rinmasin
# Ishlab chiqish vositalari saytda kerak emas
location ^~ /node_modules/ { deny all; }
location ^~ /tools/ { deny all; }
location ~ ^/(package(-lock)?\.json|eslint\.config\.js)$ { deny all; }
