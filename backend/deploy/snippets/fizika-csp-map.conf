# Content-Security-Policy — faqat statik sayt uchun (http kontekstida, server blokidan oldin ulanadi).
# script-src 'self': HTML ichidagi kod va onclick="..." bajarilmaydi — XSS bo'lsa ham zararli skript ishlamaydi
#   (sahifalar faqat o'z .js fayllaridan foydalanadi; tugmalar data-click orqali — theme.js).
# style-src 'unsafe-inline': sahifalar va modellar style="..." atributlaridan foydalanadi (uslub — skript emas).
# /admin/, /api/ (Swagger), /static/ — Django o'zi boshqaradi (Unfold va Swagger o'z skriptlari bilan), ularga qo'llanmaydi.
# API boshqa domenda bo'lsa (api.js → API_BASE), connect-src va script-src ga o'sha manzilni qo'shing.
map $uri $fizika_csp {
    ~^/(api|admin|static)/  "";
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}
