# Bitta domen: statik sayt "/" da, API "/api/" va admin "/admin/" da — CORS kerak emas (TZ 9.3).
# Bu — HTTP (80) varianti: sinov yoki HTTPS'ni oldidagi balanslovchi bajaradigan holat uchun.
# Production'da HTTPS: deploy/nginx-ssl.conf (certbot / Let's Encrypt) — .env da SECURE_SSL_REDIRECT=true.
upstream django {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/snippets/fizika-common.conf;
}
