# Bitta domen: statik sayt "/" da, API "/api/" va admin "/admin/" da — CORS kerak emas (TZ 9.3).
# HTTPS uchun certbot (Let's Encrypt) yoki hosting sertifikatini 443-portga ulang.
upstream django {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/   { proxy_pass http://django; }
    location /admin/ { proxy_pass http://django; }
    location /static/ { proxy_pass http://django; }   
    location /media/ { alias /srv/media/; expires 7d; }

    # Statik sayt (o'zgarmagan holda)
    root /srv/site;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location ~* \.(html)$ { add_header Cache-Control "no-cache"; }
    location ~* \.(css|js)$ { expires 1d; }
    location ~* \.(png|jpg|svg|woff2|pdf|docx)$ { expires 7d; }
    location ~ /\.(git|env) { deny all; }
    location ^~ /backend/ { deny all; }   # backend manba kodi saytda ko'rinmasin
}
