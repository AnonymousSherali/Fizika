# Production: HTTPS (Let's Encrypt). Sertifikat olish (bir marta, serverda):
#   docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d site.uz -d www.site.uz
# so'ng docker-compose.yml da nginx konfiguratsiyasini shu faylga almashtiring (README → «HTTPS»).
upstream django {
    server api:8000;
}

server {
    listen 80;
    server_name site.uz www.site.uz;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name site.uz www.site.uz;
    server_tokens off;
    client_max_body_size 20m;

    ssl_certificate     /etc/letsencrypt/live/site.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/snippets/fizika-common.conf;
}
